[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-max"
version = "0.1.0"
description = "Project MAX V0: a deliberately dirty synthetic Meridian Bank"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "Faker>=28,<40",
  "pandas>=2.2,<3",
  "Pillow>=10,<13",
  "psycopg[binary]>=3.2,<4",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
  "reportlab>=4.2,<5",
  "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = [
  "CairoSVG>=2.7,<3",
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
max-bank = "project_max.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "postgres: requires MAX_TEST_DATABASE_URL and a disposable PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
